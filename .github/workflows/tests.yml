name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -usail -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: sail
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          composer install --no-interaction
          npm ci
          cp .env.example .env
          php artisan key:generate
          npm run build

      - name: Validate migrations
        run: DB_DATABASE=testing php artisan migrate --force

      - name: Run CI Checks
        run: composer ci:check

  e2e:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -usail -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    env:
      APP_URL: http://localhost:8000
      DB_HOST: 127.0.0.1
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      MAIL_HOST: 127.0.0.1
      MAIL_PORT: 1025
      PHP_CLI_SERVER_WORKERS: 4
      BROADCAST_CONNECTION: 'null'
      VITE_REVERB_APP_KEY: ''
      E2E_BASE_URL: http://localhost:8000
      E2E_MAILPIT_URL: http://localhost:8025
      E2E_NO_LIVE: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          composer install --no-interaction
          npm ci
          npx playwright install --with-deps chromium
          cp .env.example .env
          php artisan key:generate
          npm run build

      - name: Prepare application
        # The end-to-end tests sign up new users, which demo mode turns off.
        env:
          DEMO_MODE: 'false'
        run: |
          php artisan migrate --force
          php artisan serve --port=8000 > storage/logs/serve.log 2>&1 &
          curl --silent --retry 20 --retry-delay 1 --retry-connrefused --output /dev/null http://localhost:8000/up

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
